<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="page-contact" data-page="contact">
    <!-- ===================== HEADER COMPONENT ===================== -->
    <div id="header-placeholder"></div>

    <!-- ===================== PAGE HEADER ===================== -->
    <section id="page-header" class="page-header">
        <div class="hero-bg-grid"></div>
        <div class="container">
            <h1 class="page-header-title">Get In Touch</h1>
            <p class="page-header-subtitle">I'd love to hear from you — let's connect</p>
        </div>
    </section>

    <!-- ===================== CONTACT ===================== -->
    <section id="contact">
        <div class="container">
            <div class="contact-content">
                <p class="contact-intro">
                    Whether you have a question or just want to say hello, I'd love to hear from you!
                </p>
                <div class="contact-methods">
                    <a href="https://linkedin.com/in/" target="_blank" rel="noopener" class="contact-card">
                        <i class="fab fa-linkedin-in"></i>
                        <strong>LinkedIn</strong>
                        <span>Connect with me</span>
                    </a>
                    <a href="https://github.com/" target="_blank" rel="noopener" class="contact-card">
                        <i class="fab fa-github"></i>
                        <strong>GitHub</strong>
                        <span>View my repos</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- ===================== FOOTER COMPONENT ===================== -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
