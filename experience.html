<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experience. Skills, projects, and professional background.">
    <title>Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="page-experience" data-page="experience">
    <!-- ===================== HEADER COMPONENT ===================== -->
    <div id="header-placeholder"></div>

    <!-- ===================== PAGE HEADER ===================== -->
    <section id="page-header" class="page-header">
        <div class="hero-bg-grid"></div>
        <div class="container">
            <h1 class="page-header-title">Experience</h1>
            <p class="page-header-subtitle">My skills, projects, and professional journey</p>
        </div>
    </section>

    <!-- ===================== EXPERIENCE / EDUCATION ===================== -->
    <section id="experience">
        <div class="container">
            <h2 class="section-title">Experience & Education</h2>
            <div class="timeline">
                <div class="timeline-item" data-aos>
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <span class="timeline-date">From — To</span>
                        <h3>Title</h3>
                        <p class="timeline-org">Name</p>
                        <p>Description</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===================== PROJECTS ===================== -->
    <section id="projects">
        <div class="container">
            <h2 class="section-title">Featured Projects</h2>
            <div class="projects-grid" id="projects-grid"></div>
        </div>
    </section>

    <!-- ===================== SKILLS ===================== -->
    <section id="skills">
        <div class="container">
            <h2 class="section-title">Skills & Technologies</h2>
            <div class="skills-grid">
                <div class="skill-card" data-aos>
                    <div class="skill-icon"><i class="fab fa-square"></i></div>
                    <h3>Skill</h3>
                    <p>Description</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ===================== FOOTER COMPONENT ===================== -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
